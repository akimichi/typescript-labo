name: ci

on:
  push:
    branches: [ main ]
    paths:
      - '__test__/**'


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Nodejs
        uses: actions/setup-node@v1
        with:
          node-version: 22

      - name: Unit test
        run: |
          npm install
          npm run test


